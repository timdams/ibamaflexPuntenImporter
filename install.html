<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Grade Importer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='4' width='56' height='56' rx='8' fill='%234f46e5'/><rect x='12' y='14' width='40' height='36' rx='3' fill='white'/><line x1='12' y1='26' x2='52' y2='26' stroke='%234f46e5' stroke-width='1.5'/><line x1='12' y1='38' x2='52' y2='38' stroke='%234f46e5' stroke-width='1.5'/><line x1='28' y1='14' x2='28' y2='50' stroke='%234f46e5' stroke-width='1.5'/><text x='20' y='24' font-size='9' font-weight='bold' fill='%234f46e5' text-anchor='middle'>A</text><text x='40' y='24' font-size='9' font-weight='bold' fill='%234f46e5' text-anchor='middle'>✓</text><text x='20' y='35' font-size='8' fill='%236b7280' text-anchor='middle'>—</text><text x='40' y='35' font-size='9' font-weight='bold' fill='%2316a34a' text-anchor='middle'>8</text><text x='20' y='47' font-size='8' fill='%236b7280' text-anchor='middle'>—</text><text x='40' y='47' font-size='9' font-weight='bold' fill='%2316a34a' text-anchor='middle'>9</text></svg>">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        p {
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .bookmarklet-button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.125rem;
            cursor: move;
            border: 2px dashed #93c5fd;
        }

        .bookmarklet-button:hover {
            background-color: #1d4ed8;
            border-color: #60a5fa;
        }

        .bookmarklet-button.error {
            background-color: #dc2626;
            border-color: #fca5a5;
            cursor: not-allowed;
        }

        .instruction {
            margin-top: 2rem;
            font-size: 0.875rem;
            background: #eff6ff;
            padding: 1rem;
            border-radius: 0.5rem;
            color: #1e3a8a;
            text-align: left;
        }

        code {
            background: #e5e7eb;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Grade Importer Installer (v10)</h1>
        <p>Fixes: Added "Show Log" feature. Empty Excel cells now correctly marked as Absent if enabled.</p>

        <a id="bookmarklet-btn" class="bookmarklet-button" href="#">
            🔢IbamaflexImporter
        </a>

        <div class="instruction">
            <strong>Check:</strong> Hover over the button above. If the URL starts with <code>javascript:</code>, it's
            ready.
        </div>
    </div>

    <!--
        The bookmarklet source is fetched at runtime from importer.js, so this file
        and importer.js never drift out of sync.
        NOTE: opening this file via file:// will fail because fetch() is blocked on
        local files in most browsers. Use GitHub Pages, or a local webserver
        (e.g. `python -m http.server 8080`).
    -->
    <script>
        (function () {
            var btn = document.getElementById('bookmarklet-btn');

            fetch('importer.js?t=' + Date.now())
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function (code) {
                    // Naive minification: strip // line comments and collapse whitespace.
                    // Safe here because importer.js has no string literals containing "//"
                    // and no semantic newline dependencies outside template literals
                    // (where newlines collapsing to spaces is fine for CSS/HTML).
                    var minified = code
                        .replace(/\/\/[^\n]*\n/g, '')
                        .replace(/\s+/g, ' ')
                        .trim();

                    var url = "javascript:(function(){" +
                        "var s=document.createElement('script');" +
                        "s.src='https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';" +
                        "s.onload=function(){" + minified + "};" +
                        "document.head.appendChild(s);" +
                        "})();";

                    btn.href = url;
                    console.log("Bookmarklet generated. Length:", url.length);
                })
                .catch(function (err) {
                    btn.classList.add('error');
                    btn.removeAttribute('href');
                    btn.textContent = '⚠ Kon importer.js niet laden — open via een webserver';
                    console.error('Failed to load importer.js:', err);
                });
        })();
    </script>
</body>

</html>
